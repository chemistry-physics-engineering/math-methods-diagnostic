<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mathematical Methods Diagnostic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one centred notebook column on faint graph paper; one card per screen. */
:root {
  --bg: #f1f0f6; --grid: #e3e1ec; --card: #ffffff; --ink: #1b1a2a; --muted: #5d5b72; --line: #d8d5e4;
  --accent: #4b3aa6; --accent-ink: #ffffff; --accent-soft: #e8e4f7; --field: #ffffff;
  --good: #11672c; --good-bg: #e1f1e5; --warn: #8f4a00; --warn-bg: #fbeedb; --bad: #b4231f; --bad-bg: #fae3e2;
  --grey-bg: #ecebf2;
  --f-display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, Menlo, monospace;
  --f-math: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14131c; --grid: #1c1b27; --card: #1d1c29; --ink: #ebe9f3; --muted: #a6a3ba; --line: #34324a;
    --accent: #a597f0; --accent-ink: #15131f; --accent-soft: #2b2645; --field: #14131c;
    --good: #82d39a; --good-bg: #183324; --warn: #f0b46e; --warn-bg: #3a2b17; --bad: #ff9590; --bad-bg: #3d1f1f;
    --grey-bg: #262436; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14131c; --grid: #1c1b27; --card: #1d1c29; --ink: #ebe9f3; --muted: #a6a3ba; --line: #34324a;
  --accent: #a597f0; --accent-ink: #15131f; --accent-soft: #2b2645; --field: #14131c;
  --good: #82d39a; --good-bg: #183324; --warn: #f0b46e; --warn-bg: #3a2b17; --bad: #ff9590; --bad-bg: #3d1f1f;
  --grey-bg: #262436; color-scheme: dark;
}
* { box-sizing: border-box; }
html { font-size: 17px; }
body {
  margin: 0; color: var(--ink); font-family: var(--f-body); line-height: 1.55;
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
#app { max-width: 800px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 26px clamp(18px, 4vw, 32px); margin-bottom: 18px; min-width: 0; }
h1, h2 { font-family: var(--f-display); text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.75rem; font-weight: 800; margin: 0 0 6px; }
h2 { font-size: 1.12rem; font-weight: 700; margin: 26px 0 8px; }
.eyebrow { font-family: var(--f-mono); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
.sub { color: var(--muted); margin: 0 0 14px; }
ul.rules { padding-left: 1.2em; margin: 8px 0; display: grid; gap: 6px; }
label { display: block; font-weight: 600; margin: 14px 0 4px; }
input[type=text] { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--ink); }
input:focus, button:focus-visible, a:focus-visible, textarea:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
.answer-row { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; background: var(--field); overflow: hidden; }
.answer-row:focus-within { outline: 3px solid var(--accent); outline-offset: 1px; }
.answer-row input { border: none; border-radius: 0; font-family: var(--f-mono); font-size: 1.15rem; padding: 12px 14px; min-width: 0; flex: 1; }
.answer-row input:focus { outline: none; background: var(--accent-soft); }
.answer-row.vec input { text-align: center; padding: 12px 6px; }
.sep { display: flex; align-items: center; padding: 0 6px; font-family: var(--f-math); font-size: 1.4rem; color: var(--muted); }
.lead-in { display: flex; align-items: center; padding: 0 14px; font-family: var(--f-math); font-size: 1.15rem; background: var(--grey-bg); border-right: 1px solid var(--line); white-space: nowrap; }
button, a.btn { font: inherit; cursor: pointer; border-radius: 8px; padding: 10px 18px; border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none; display: inline-block; }
button.primary, a.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
button.quiet { color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }
.qhead { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; color: var(--muted); font-size: .92rem; margin-bottom: 12px; flex-wrap: wrap; }
.qhead .where { font-family: var(--f-mono); font-size: .8rem; letter-spacing: .05em; text-transform: uppercase; }
.timer { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; }
.timer.low { color: var(--warn); }
.prompt { font-size: 1.2rem; margin: 4px 0 18px; }
.prompt p { margin: 0 0 .6em; }
.hint { color: var(--muted); font-size: .92rem; margin: 8px 0; }
.opts { display: grid; gap: 8px; margin: 6px 0 12px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 12px 14px; width: 100%; }
.opt .key { font-family: var(--f-mono); font-weight: 600; color: var(--accent); min-width: 1.2em; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.preview { min-height: 2.6em; margin: 10px 0 6px; padding: 8px 12px; border-radius: 8px; background: var(--grey-bg); display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
.preview .lead { color: var(--muted); font-size: .9rem; }
.keys { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; }
.keys button { padding: 5px 12px; min-width: 2.6em; font-family: var(--f-math); font-size: 1.05rem; }
.keys button.op { font-family: var(--f-mono); font-size: .9rem; color: var(--muted); }
.math { font-family: var(--f-math); font-size: 1.2rem; line-height: 1.2; }
.math i { font-style: italic; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 2px; }
.frac > span { padding: 0 3px; }
.frac > span:first-child { border-bottom: 1.5px solid currentColor; }
.rad { white-space: nowrap; }
.rad > span { display: inline-block; border-top: 1.5px solid currentColor; padding: .12em 2px 0; margin-left: 1px; line-height: 1.25; }
.math sup { line-height: 0; }
.mj { display: inline-flex; align-items: center; font-size: 1.2rem; }
.mj mjx-container { margin: 0 !important; }
.vecprev { display: inline-flex; align-items: center; gap: 2px; font-family: var(--f-math); font-size: 1.2rem; }
.math sup { font-size: .7em; }
.mj-inline mjx-container { margin: 0 .1em !important; }
math-field.mf { flex: 1; min-width: 0; display: block; font-size: 1.3rem; padding: 8px 12px; border: none; background: transparent; color: var(--ink);
  --caret-color: var(--accent); --selection-background-color: var(--accent-soft); --primary-color: var(--accent); --smart-fence-color: var(--muted); }
math-field.mf:focus-within { outline: none; background: var(--accent-soft); }
math-field.mf::part(menu-toggle) { display: none; }
.prompt .mj-inline svg { vertical-align: middle; }
.msg { min-height: 1.4em; margin: 6px 0 10px; }
.msg.err { color: var(--bad); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; padding: 8px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--f-mono); font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
td.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.chip { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .84rem; font-weight: 700; white-space: nowrap; }
.chip.l4, .chip.l3, .chip.right { background: var(--good-bg); color: var(--good); }
.chip.l2, .chip.tag { background: var(--accent-soft); color: var(--accent); }
.chip.l1, .chip.skipped { background: var(--warn-bg); color: var(--warn); }
.chip.l0, .chip.wrong { background: var(--bad-bg); color: var(--bad); }
.chip.nt { background: var(--grey-bg); color: var(--muted); }
.ladder { font-family: var(--f-mono); white-space: nowrap; letter-spacing: .1em; }
.band { display: grid; gap: 4px; padding: 16px 18px; border-radius: 10px; background: var(--accent-soft); margin: 12px 0; }
.band .name { font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; color: var(--accent); }
.meter { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 6px; }
.meter span { height: 8px; border-radius: 4px; background: var(--line); }
.meter span.on { background: var(--accent); }
.meter-labels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; font-size: .74rem; color: var(--muted); }
.small { font-size: .88rem; color: var(--muted); }
.findings { display: grid; gap: 10px; padding: 0; margin: 8px 0; list-style: none; }
.findings li { padding: 10px 14px; border-left: 4px solid var(--accent); background: var(--grey-bg); border-radius: 0 8px 8px 0; }
.findings li b { display: block; }
textarea.copybox { width: 100%; height: 8em; font-family: var(--f-mono); font-size: .8rem; background: var(--field); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
@media (prefers-reduced-motion: no-preference) { .card { animation: rise .18s ease-out; } @keyframes rise { from { transform: translateY(4px); } to { transform: none; } } }
</style>
</head>

<script>window.MathJax = { startup: { typeset: false }, svg: { fontCache: 'local' } };</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>

<div id="app"></div>

<script id="diag-core">
/* Mathematical methods diagnostic (ODEs, series, vectors, vector spaces, operators): bank, graders, engine. */
var Calc3Diag = (function () {
  'use strict';

  var CHAPTERS = [
    [1, 'Calculus and Series Readiness'], [2, 'Second-Order Linear ODEs'], [3, 'Damped Oscillators'], [4, 'Reduction of Order'],
    [5, 'Power Series Solutions'], [6, 'Vector Algebra'], [7, 'Vector Calculus'], [8, 'Vector Spaces'], [9, 'Linear Operators']
  ];
  var SETTINGS = { title: 'Mathematical Methods Diagnostic', exam: 'MATHMETH-DIAG', seconds_per_item: 240, max_items: 50, tolerance: 5e-4,
                   sym_every: 3, email_to: 'textbookbreakdown@gmail.com', subject_tag: '[MATHMETH-DIAG]' };

  function mc(ch, rung, v, q, right, wrong) { return { ch: ch, rung: rung, v: v, type: 'mc', q: q, opts: [right].concat(wrong) }; }
  function num(ch, rung, v, q, ans) { return { ch: ch, rung: rung, v: v, type: 'num', q: q, ans: ans }; }
  function vec(ch, rung, v, q, ans) { return { ch: ch, rung: rung, v: v, type: 'vec', q: q, ans: ans }; }
  function sym(ch, rung, q, lhs, vars, key, o) { o = o || {}; return { ch: ch, rung: rung, v: 'S', type: 'sym', q: q, lhs: lhs, vars: vars, key: key, ranges: o.ranges || {}, upToConst: !!o.upToConst }; }

  var ITEMS = [
    // ==== 1 Calculus and Series Readiness
    mc(1, 1, 'A', 'What is $\\dfrac{d}{dx}\\,e^{3x}$?', '$3e^{3x}$', ['$e^{3x}$', '$3e^{2x}$', '$\\dfrac{e^{3x}}{3}$']),
    mc(1, 1, 'B', 'The Maclaurin series of $e^x$ begins:', '$1 + x + \\frac{x^2}{2} + \\frac{x^3}{6} + \\cdots$', ['$x + \\frac{x^2}{2} + \\frac{x^3}{3} + \\cdots$', '$1 - x + \\frac{x^2}{2} - \\frac{x^3}{6} + \\cdots$', '$1 + x + x^2 + x^3 + \\cdots$']),
    num(1, 2, 'A', 'Evaluate $\\displaystyle\\int_0^1 2x\\,e^{x^2}\\,dx$.', 'e-1'),
    num(1, 2, 'B', 'Let $f(x) = x\\ln x$. Find $f\'(e)$.', '2'),
    sym(1, 2, 'Let $f(x) = x^2 e^{-x}$. Find $f\'(x)$.', "f'(x)", ['x'], '2x*e^(-x)-x^2*e^(-x)'),
    num(1, 3, 'A', 'Find the coefficient of $x^3$ in the Maclaurin series of $\\sin(2x)$.', '-4/3'),
    num(1, 3, 'B', 'Evaluate $\\displaystyle\\int_0^{\\pi} x\\sin x\\,dx$.', 'pi'),
    sym(1, 3, 'For $|x| < 2$, find the sum of the series $\\displaystyle\\sum_{n=0}^{\\infty} \\left(\\frac{x}{2}\\right)^n$.', 'S', ['x'], '2/(2-x)', { ranges: { x: [-1.5, 1.5] } }),
    num(1, 4, 'A', 'Find the radius of convergence of $\\displaystyle\\sum_{n=1}^{\\infty} \\frac{n\\,x^n}{3^n}$.', '3'),
    num(1, 4, 'B', 'Evaluate $\\displaystyle\\int_0^{\\infty} x\\,e^{-2x}\\,dx$.', '1/4'),
    sym(1, 4, 'Write $f(x) = \\dfrac{1}{1-3x}$ as $\\sum a_n x^n$. Find $a_n$ in terms of $n$.', 'a_n', ['n'], '3^n'),

    // ==== 2 Second-Order Linear ODEs
    mc(2, 1, 'A', 'The characteristic equation of $y\'\' + 5y\' + 6y = 0$ is:', '$r^2 + 5r + 6 = 0$', ['$r^2 + 6r + 5 = 0$', '$5r + 6 = 0$', '$r^2 = 5r + 6$']),
    mc(2, 1, 'B', 'The characteristic roots are $a \\pm bi$ with $b \\ne 0$. The general solution is:', '$e^{ax}\\left(C_1\\cos bx + C_2\\sin bx\\right)$', ['$C_1e^{ax} + C_2e^{bx}$', '$(C_1 + C_2x)\\,e^{ax}$', '$C_1\\cos ax + C_2\\sin bx$']),
    num(2, 2, 'A', 'Find the larger root of the characteristic equation of $y\'\' + 5y\' + 6y = 0$.', '-2'),
    num(2, 2, 'B', '$y = e^{rx}$ with $r > 0$ solves $y\'\' - 9y = 0$. Find $r$.', '3'),
    sym(2, 2, 'Solve $y\'\' + \\omega^2 y = 0$ with $y(0) = A$ and $y\'(0) = 0$. Give $y(t)$.', 'y(t)', ['A', 'omega', 't'], 'A*cos(omega*t)'),
    num(2, 3, 'A', 'Solve $y\'\' + 4y = 0$ with $y(0) = 1$, $y\'(0) = 2$. Find $y(\\pi/8)$.', 'sqrt(2)'),
    num(2, 3, 'B', 'Solve $y\'\' - 3y\' + 2y = 0$ with $y(0) = 0$, $y\'(0) = 1$. Find $y(\\ln 2)$.', '2'),
    sym(2, 3, 'Solve $y\'\' - 2y\' + y = 0$ with $y(0) = 1$, $y\'(0) = 0$.', 'y(x)', ['x'], '(1-x)*e^x'),
    num(2, 4, 'A', '$y\'\' + y = 3e^{2x}$ has a particular solution $y_p = A\\,e^{2x}$. Find $A$.', '3/5'),
    num(2, 4, 'B', '$y\'\' + y = 2\\cos x$ has a particular solution $y_p = B\\,x\\sin x$. Find $B$.', '1'),
    sym(2, 4, 'Find the Wronskian $W\\!\\left(e^{ax},\\, e^{bx}\\right)$.', 'W', ['a', 'b', 'x'], '(b-a)*e^((a+b)*x)'),

    // ==== 3 Damped Oscillators
    mc(3, 1, 'A', 'For $m x\'\' + c x\' + k x = 0$, critical damping happens when:', '$c^2 = 4mk$', ['$c = 0$', '$c^2 > 4mk$', '$c^2 < 4mk$']),
    mc(3, 1, 'B', 'An underdamped oscillator:', 'Oscillates with a decaying amplitude', ['Returns to equilibrium without oscillating', 'Oscillates with a constant amplitude', 'Never returns toward equilibrium']),
    num(3, 2, 'A', 'An undamped spring has $m = 1$ and $k = 16$. Find its angular frequency $\\omega_0$.', '4'),
    num(3, 2, 'B', 'An oscillator has $m = 2$ and $k = 8$. Find the damping constant $c$ that makes it critically damped.', '8'),
    sym(3, 2, 'Find the natural angular frequency $\\omega_0$ of $m x\'\' + k x = 0$.', '\\omega_0', ['k', 'm'], 'sqrt(k/m)'),
    num(3, 3, 'A', 'Find the damped angular frequency of $x\'\' + 2x\' + 5x = 0$.', '2'),
    num(3, 3, 'B', '$x\'\' + 6x\' + 5x = 0$ is overdamped. Find the characteristic root closest to zero.', '-1'),
    sym(3, 3, '$m x\'\' + c x\' + k x = 0$ is underdamped. Find its damped angular frequency $\\omega_d$.', '\\omega_d', ['k', 'm', 'c'], 'sqrt(k/m-c^2/(4m^2))', { ranges: { c: [0.1, 0.5], k: [2, 4], m: [0.5, 1.5] } }),
    num(3, 4, 'A', 'Solve $x\'\' + 2x\' + x = 0$ with $x(0) = 1$, $x\'(0) = 0$. Find $x(1)$.', '2/e'),
    num(3, 4, 'B', 'For $x\'\' + 0.2x\' + 4x = 0$, how long does it take the amplitude to halve?', '10ln(2)'),
    sym(3, 4, 'Solve $x\'\' + 2\\omega x\' + \\omega^2 x = 0$ with $x(0) = 0$ and $x\'(0) = v$.', 'x(t)', ['v', 'omega', 't'], 'v*t*e^(-omega*t)'),

    // ==== 4 Reduction of Order
    mc(4, 1, 'A', 'Reduction of order is used to:', 'Find a second solution when one solution $y_1$ is known', ['Find a particular solution', 'Solve first-order equations only', 'Lower the degree of a polynomial']),
    mc(4, 1, 'B', 'In reduction of order you substitute:', '$y = v(x)\\,y_1(x)$', ['$y = y_1(x) + v(x)$', '$y = e^{vx}$', '$y = v\'(x)$']),
    num(4, 2, 'A', '$y\'\' - 2y\' + y = 0$ has $y_1 = e^x$. Substituting $y = v\\,e^x$ gives $v\'\' = 0$. With $v(0) = 0$ and $v\'(0) = 1$, find $v(2)$.', '2'),
    num(4, 2, 'B', 'For $y\'\' + \\frac{2}{x}\\,y\' + q(x)\\,y = 0$, Abel\'s formula gives $W = C\\,e^{-\\int p\\,dx}$. If $W(1) = 1$, find $W(2)$.', '1/4'),
    sym(4, 2, 'For $x^2y\'\' + xy\' - y = 0$ (so $p = 1/x$), use Abel\'s formula with $W(1) = 1$. Find $W(x)$.', 'W(x)', ['x'], '1/x'),
    num(4, 3, 'A', '$x^2y\'\' - 3xy\' + 4y = 0$ has $y_1 = x^2$. Reduction of order gives $y_2 = x^2\\ln x$. Find $y_2(e)$.', 'e^2'),
    num(4, 3, 'B', 'For $x^2y\'\' - 3xy\' + 4y = 0$ with $y_1 = x^2$, reduction of order gives $v\' = W/y_1^2$ with $W = x^3$. Find $v\'(2)$.', '1/2'),
    sym(4, 3, 'For $x^2y\'\' - 3xy\' + 4y = 0$ with $y_1 = x^2$, you find $v\' = 1/x$. Taking $v(1) = 0$, write $y_2 = v\\,y_1$.', 'y_2', ['x'], 'x^2*ln(x)'),
    num(4, 4, 'A', '$(1 - x^2)\\,y\'\' - 2xy\' + 2y = 0$ has $y_1 = x$. Its second solution is $y_2 = \\frac{x}{2}\\ln\\frac{1+x}{1-x} - 1$. Find $y_2(1/2)$.', 'ln(3)/4-1'),
    num(4, 4, 'B', '$y\'\' - \\frac{2}{x^2}\\,y = 0$ has $y_1 = x^2$. A second solution has the form $y_2 = x^m$ with $m \\ne 2$. Find $m$.', '-1'),
    sym(4, 4, '$y\'\' - 2ay\' + a^2y = 0$ has $y_1 = e^{ax}$. With $y = v\\,y_1$, $v(0) = 0$ and $v\'(0) = 1$, find $y_2$.', 'y_2', ['a', 'x'], 'x*e^(a*x)'),

    // ==== 5 Power Series Solutions
    mc(5, 1, 'A', '$x = 0$ is an ordinary point of $y\'\' + xy = 0$ because:', 'The coefficients are analytic at $x = 0$', ['The solution is zero there', 'The equation is first order', 'Every term vanishes at $x = 0$']),
    mc(5, 1, 'B', 'Putting $y = \\sum a_n x^n$ into $y\' = y$ gives the recurrence:', '$a_{n+1} = \\dfrac{a_n}{n+1}$', ['$a_{n+1} = a_n$', '$a_{n+1} = (n+1)\\,a_n$', '$a_n = 0$']),
    num(5, 2, 'A', 'Solve $y\' = 2y$ with $y = \\sum a_n x^n$ and $a_0 = 1$. Find $a_3$.', '4/3'),
    num(5, 2, 'B', 'Solve $y\'\' + y = 0$ with $y = \\sum a_n x^n$, $a_0 = 1$ and $a_1 = 0$. Find $a_2$.', '-1/2'),
    sym(5, 2, 'For $y\'\' + y = 0$ with $y = \\sum a_n x^n$, find $a_{n+2}$ in terms of $a_n$ and $n$. (Type $a_n$ as an.)', 'a_{n+2}', ['an', 'n'], '-an/((n+2)(n+1))'),
    num(5, 3, 'A', 'For Airy\'s equation $y\'\' - xy = 0$ with $a_0 = 1$ and $a_1 = 0$, find $a_3$.', '1/6'),
    num(5, 3, 'B', '$y\'\' + xy\' + y = 0$ gives $a_{n+2} = -\\dfrac{a_n}{n+2}$. With $a_0 = 1$, find $a_4$.', '1/8'),
    sym(5, 3, 'The power series solution of $y\'\' + y = 0$ with $y(0) = 0$ and $y\'(0) = 1$ sums to which function?', 'y(x)', ['x'], 'sin(x)'),

      ops.map(function (o) { return el('button', { type: 'button', class: 'op', onclick: function () { insertAt(target(), o[1], o[2]); } }, o[0]); }));
  }
  function answerBox(item, onEnter, say) {
    var isVec = item.type === 'vec', vars = item.type === 'sym' ? item.vars : [];
    var n = isVec ? item.vals.length : 1, inputs = [], last = null;
    var pv = el('div', { class: 'preview', 'aria-live': 'polite' });
    var refresh = function () { showPreview(pv, inputs.map(fieldVal), vars, isVec); };
    for (var j = 0; j < n; j++) {
      var inp = makeField({
        'aria-label': isVec ? 'Component ' + (j + 1) : 'Your answer' });
      inp.addEventListener('input', function () { say(''); refresh(); });
      inp.addEventListener('focus', function (e) { last = e.target; });
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); onEnter(); } });
      ['paste', 'drop'].forEach(function (ev) { inp.addEventListener(ev, function (e) { e.preventDefault(); say('Pasting is turned off. Please type your answer.', 'err'); }); });
      inputs.push(inp);
    }
    var row;
    if (isVec) {
      var kids = [el('span', { class: 'sep', text: '⟨' })];
      inputs.forEach(function (x, j) { if (j) { kids.push(el('span', { class: 'sep', text: ',' })); } kids.push(x); });
      kids.push(el('span', { class: 'sep', text: '⟩' }));
      row = el('div', { class: 'answer-row vec' }, kids);
    } else {
      row = el('div', { class: 'answer-row' }, item.lhs ? el('span', { class: 'lead-in' }, texSpan(item.lhs + ' =')) : null, inputs[0]);
    }
    refresh();
    return {
      node: el('div', null, row, keyRow(function () { return last || inputs[0]; }, vars), pv),
      value: function () { return isVec ? inputs.map(function (x) { return fieldVal(x).trim(); }) : fieldVal(inputs[0]).trim(); },
      text: function () { return isVec ? '⟨' + inputs.map(function (x) { return fieldVal(x).trim(); }).join(', ') + '⟩' : fieldVal(inputs[0]).trim(); },
      empty: function () { return inputs.every(function (x) { return !fieldVal(x).trim(); }); },
      focus: function () { inputs[0].focus(); }
    };
  }

  // ------------------------------------------------------------ start screen
  function showStart() {
    clear(app);
    var demoNum = answerBox({ type: 'num' }, function () {}, function () {});
    var demoSym = answerBox({ type: 'sym', vars: ['x', 'y'], lhs: '\\partial f/\\partial x' }, function () {}, function () {});
    var nameIn = el('input', { type: 'text', id: 'name', autocomplete: 'off' });
    var err = el('div', { class: 'msg err' });
    app.appendChild(el('div', { class: 'card' },
      el('h1', { text: S.title }),
      el('ul', { class: 'rules' },
        el('li', { text: 'Use pencil and paper. No calculator, AI, internet or books.' }),
        el('li', { text: 'You have 4 minutes per question.' }),
        el('li', { text: 'If you are stuck, press "I don\'t know".' }),
        el('li', { text: 'At the end, copy your results and send them to the email.' }))));
    app.appendChild(el('div', { class: 'card' },
      el('label', { style: 'margin-top:0', text: 'Try typing numbers before the exam.' }), demoNum.node,
      el('label', { style: 'margin-top:22px', text: 'Try typing formulas before the exam.' }), demoSym.node,
      el('label', { for: 'name', style: 'margin-top:22px', text: 'Your name' }), nameIn, err,
      el('div', { class: 'row', style: 'margin-top:12px' }, el('button', { class: 'primary', text: 'Begin the exam', onclick: function () {
        var name = nameIn.value.trim();
        if (!name) { err.textContent = 'Please enter your name.'; nameIn.focus(); return; }
        student.name = name; begin();
      } }))));
  }

  function begin() {
    engine = P.create();
    log = []; examStart = Date.now(); blurs = 0; examActive = true;
    nextQuestion();
  }
  function nextQuestion() {
    var item = engine.next();
    if (!item) { examActive = false; showDone(); return; }
    showQuestion(item, engine.count() + 1);
  }

  // ------------------------------------------------------------ question screen
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function showQuestion(item, number) {
    clear(app);
    cur = { item: item, start: Date.now(), done: false, timer: null, choice: null, box: null };
    var timerEl = el('span', { class: 'timer' });
    var msg = el('div', { class: 'msg', 'aria-live': 'polite' });
    function say(t, kind) { msg.className = 'msg' + (kind ? ' ' + kind : ''); msg.textContent = t || ''; }
    var body;
    if (item.type === 'mc') {
      var order = shuffle(item.opts.map(function (o, i) { return i; })), btns = [];
      body = el('div', { class: 'opts', role: 'group', 'aria-label': 'Answer choices' }, order.map(function (idx, k) {
        var b = el('button', { type: 'button', class: 'opt', 'aria-pressed': 'false', onclick: function () {
          cur.choice = idx; btns.forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); say('');
        } }, el('span', { class: 'key', text: 'ABCD'[k] }), el('span', null, rich(item.opts[idx])));
        btns.push(b); return b;
      }));
    } else {
      cur.box = answerBox(item, function () { submit(); }, say);
      body = el('div', null, item.type === 'sym' ? el('p', { class: 'hint', text: 'Answer with the letters on the buttons.' }) : null, cur.box.node);
    }
    function typed() { return item.type === 'mc' ? (cur.choice === null ? '' : item.opts[cur.choice]) : cur.box.text(); }
    function submit() {
      if (cur.done) { return; }
      if (item.type === 'mc') {
        if (cur.choice === null) { say('Choose an answer first, or press "I don\'t know".', 'err'); return; }
        return finish(cur.choice === 0 ? 'correct' : 'wrong', typed(), {});
      }
      var res = P.grade(item, cur.box.value());
      if (res.status === 'invalid') { say(res.message, 'err'); cur.box.focus(); return; }
      finish(res.status, typed(), res.tag ? { tag: res.tag } : {});
    }
    app.appendChild(el('div', { class: 'card' },
      el('div', { class: 'qhead' }, el('span', { class: 'where', text: 'Question ' + number + ' · ' + item.ch + '. ' + chTitle[item.ch] }), timerEl),
      el('div', { class: 'prompt' }, el('p', null, rich(item.q))),
      body, msg,
      el('div', { class: 'row spread' },
        el('button', { class: 'primary', text: 'Submit', onclick: submit }),
        el('button', { class: 'quiet', text: "I don't know", onclick: function () { finish('skip', '', {}); } }))));
    if (cur.box) { cur.box.focus(); }
    var tick = function () {
      var left = LIMIT - Math.floor((Date.now() - cur.start) / 1000);
      timerEl.textContent = clock(Math.max(left, 0));
      timerEl.className = 'timer' + (left <= 20 ? ' low' : '');
      if (left <= 0 && !cur.done) {
        var ok = item.type === 'mc' ? cur.choice === 0 : (!cur.box.empty() && P.grade(item, cur.box.value()).status === 'correct');
        finish(ok ? 'correct' : 'skip', typed(), { timedOut: true });
      }
    };
    cur.timer = setInterval(tick, 250); tick();
  }
  function finish(outcome, value, extra) {
    if (cur.done) { return; }
    cur.done = true;
    clearInterval(cur.timer);
    var seconds = Math.round((Date.now() - cur.start) / 1000);
    var rec = { id: cur.item.id, answer: String(value || ''), outcome: outcome, seconds: seconds, timedOut: !!extra.timedOut, tag: extra.tag || null };
    engine.record(outcome, { seconds: seconds, timedOut: rec.timedOut, tag: rec.tag });
    log.push(rec);
    nextQuestion();
  }

  // ------------------------------------------------------------ student end screen: just the results JSON
  var RCODE = { pass: 'p', fail: 'f', assumed: 'a', numonly: 'n', none: '-' };
  var RNAME = { p: 'pass', f: 'fail', a: 'assumed', n: 'numonly', '-': 'none' };
  var OCODE = { correct: 'c', wrong: 'w', skip: 's' };
  function resultData(sum) {
    return {
      exam: S.exam, version: 1, id: P.makeId(Date.now()), name: student.name,
      date: new Date().toISOString().replace(/\.\d+Z$/, 'Z'),
      seconds: Math.round((Date.now() - examStart) / 1000), switches: blurs,
      band: sum.band.name, avg: Math.round(sum.mean * 100) / 100,
      topics: sum.chapters.map(function (c) { return [c.level, c.rungs.map(function (r) { return RCODE[r]; }).join('')]; }),
      sym: [sum.symbolic.right, sum.symbolic.asked], tags: sum.tags,
      log: log.map(function (r) {
        var row = [r.id, r.timedOut ? 't' : OCODE[r.outcome], r.seconds, r.answer];
        if (r.tag) { row.push(r.tag); }
        return row;
      })
    };
  }
  function showDone() {
    clear(app);
    var json = JSON.stringify(resultData(engine.summary()));
    var e = encodeURIComponent;
    var gmail = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + e(S.email_to) + '&su=' + e(S.subject_tag + ' ' + student.name) + '&body=' + e(json);
    var box = el('textarea', { class: 'copybox', readonly: 'readonly', 'aria-label': 'Your results' });
    box.value = json;
    var copied = el('span', { class: 'small', 'aria-live': 'polite' });
    var fallback = el('p', { class: 'small', hidden: 'hidden', 'aria-live': 'polite', text: 'Didn\'t work? Send it to ' + S.email_to });
    app.appendChild(el('div', { class: 'card' },
      el('p', { class: 'eyebrow', text: 'Finished' }),
      el('h1', { text: 'Send your results' }),
      el('p', { text: 'Copy the text below and send it to Ken, or press Email Ken.' }),
      box,
      el('div', { class: 'row', style: 'margin-top:10px' },
        el('button', { class: 'primary', text: 'Copy', onclick: function () {
          box.focus(); box.select();
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(json).then(function () { copied.textContent = 'Copied.'; }, function () { copied.textContent = 'Press Ctrl+C (or Cmd+C) to copy.'; });
          } else { copied.textContent = 'Press Ctrl+C (or Cmd+C) to copy.'; }
        } }),
        el('a', { class: 'btn', href: gmail, target: '_blank', rel: 'noopener', text: 'Email Ken', onclick: function () { fallback.hidden = false; } }),
        copied),
      fallback));
    window.scrollTo(0, 0);
  }

  // ------------------------------------------------------------ teacher view (#report): paste a student's JSON
  var MARK = { pass: '✓', fail: '✗', assumed: '(✓)', numonly: '✓*', none: '·' };
  function ladder(c) { return c.rungs.map(function (r, i) { return (i + 1) + MARK[r]; }).join(' '); }
  var LEGEND = 'Levels: 1 concept, 2 one-step, 3 multi-step, 4 challenge. ✓ right, ✗ missed, (✓) assumed from a harder right answer, ✓* right with numbers after missing the formula version, · not asked.';
  function fromData(d) {
    var band = P.BANDS.filter(function (b) { return b.name === d.band; })[0] || P.BANDS[0];
    var chapters = P.CHAPTERS.map(function (c, i) {
      var t = (d.topics || [])[i] || [null, '----'];
      var s = t[0] === null ? { key: 'nt', label: 'Not tested', plan: 'Not reached (question limit): learn this topic from the start' } : P.STATUS[t[0]];
      var numOnly = t[1].indexOf('n') >= 0;
      return { n: c[0], title: c[1], level: t[0], key: s.key, label: s.label, numOnly: numOnly,
               plan: s.plan + (numOnly ? '. Also practise the general (letters) version of its formulas.' : ''),
               rungs: t[1].split('').map(function (ch) { return RNAME[ch] || 'none'; }) };
    });
    var tags = Object.keys(d.tags || {}).filter(function (k) { return P.TAGS[k]; })
      .map(function (k) { return { key: k, name: P.TAGS[k].name, say: P.TAGS[k].say, count: d.tags[k] }; })
      .sort(function (x, y) { return y.count - x.count; });
    var sym = d.sym || [0, 0];
    return { band: band, bandIndex: P.BANDS.indexOf(band), chapters: chapters, tags: tags,
             symbolic: { right: sym[0], asked: sym[1], numOnly: chapters.filter(function (c) { return c.numOnly; }).map(function (c) { return c.n; }) } };
  }
  function findings(sum) {
    var out = [], sy = sum.symbolic, pre = sum.chapters[0];
    if (pre.level !== null && pre.level <= 1) {
      out.push({ head: 'Prerequisites', text: 'Calculus and series readiness came out at level ' + pre.level + '. Review differentiation, integration and Taylor series before the ODE and power series topics.' });
    }
    if (sy.asked) {
      var line = sy.right + ' of ' + sy.asked + ' formula (letters) questions right.';
      if (sy.numOnly.length) {
        out.push({ head: 'Formulas vs numbers', text: line + ' Solved with numbers but not in general form in: ' +
          sy.numOnly.map(function (n) { return chTitle[n]; }).join(', ') + '. The gap is symbolic manipulation, not the method.' });
      } else if (sy.right < sy.asked) {
        out.push({ head: 'Formulas vs numbers', text: line + ' Each missed formula question was missed with numbers too, so the gap is the method itself.' });
      } else {
        out.push({ head: 'Formulas vs numbers', text: line + ' Working in general form is a strength.' });
      }
    }
    sum.tags.forEach(function (t) { out.push({ head: t.name + ' (' + t.count + '×)', text: t.say }); });
    if (!sum.tags.length) { out.push({ head: 'Slip patterns', text: 'No wrong answer matched a common slip (sign, π, factor of 2, squares, upside-down fraction, vector length).' }); }
    return out;
  }
  function keyNode(item) {
    function m(src, vars) { return mathNode(P.parseExpr(src, vars).ast); }
    if (item.type === 'mc') { return rich(item.opts[0]); }
    if (item.type === 'num') { return m(item.ans, []); }
    if (item.type === 'vec') {
      var s = el('span', { class: 'vecprev' }, '⟨');
      item.ans.forEach(function (a, j) { if (j) { s.appendChild(document.createTextNode(', ')); } s.appendChild(m(a, [])); });
      s.appendChild(document.createTextNode('⟩'));
      return s;
    }
    var n = el('span', { class: 'vecprev' }, m(item.key, item.vars));
    if (item.upToConst) { n.appendChild(document.createTextNode(' + C')); }
    return n;
  }
  function showViewer() {
    clear(app);
    var input = el('textarea', { class: 'copybox', id: 'paste', 'aria-label': 'Student results JSON', placeholder: '{"exam":"' + S.exam + '", ...}' });
    var err = el('div', { class: 'msg err' });
    var out = el('div');
    app.appendChild(el('div', { class: 'card' },
      el('p', { class: 'eyebrow', text: 'Teacher view' }),
      el('h1', { text: 'Read a result' }),
      el('label', { for: 'paste', text: 'Paste the student\'s results' }), input, err,
      el('div', { class: 'row' }, el('button', { class: 'primary', text: 'Show report', onclick: function () {
        var raw = input.value, a = raw.indexOf('{'), b = raw.lastIndexOf('}'), d = null;
        try { d = JSON.parse(raw.slice(a, b + 1)); } catch (e) { d = null; }
        if (!d || d.exam !== S.exam) { err.textContent = 'That does not look like results from this exam.'; return; }
        err.textContent = ''; clear(out); out.appendChild(renderReport(d));
      } }))));
    app.appendChild(out);
  }
  function renderReport(d) {
    var sum = fromData(d);
    var meter = el('div', { class: 'meter' }, P.BANDS.map(function (b, i) { return el('span', { class: i <= sum.bandIndex ? 'on' : '' }); }));
    var meterLabels = el('div', { class: 'meter-labels' }, P.BANDS.map(function (b) { return el('span', { text: b.name }); }));
    var rows = sum.chapters.map(function (c) {
      return el('tr', null, el('td', { class: 'num', text: String(c.n) }), el('td', { text: c.title }),
        el('td', null, chip(c.key, c.label)), el('td', { text: c.plan }), el('td', { class: 'ladder small', text: ladder(c) }));
    });
    var RES = { c: ['right', 'Right'], w: ['wrong', 'Missed'], s: ['skipped', 'Skipped'], t: ['skipped', 'Timed out'] };
    var logRows = (d.log || []).map(function (r, i) {
      var item = byId[r[0]];
      if (!item) { return el('tr', null, el('td', { class: 'num', text: String(i + 1) }), el('td', { colspan: '6', text: 'Unknown question ' + r[0] })); }
      var res = RES[r[1]] || RES.s;
      return el('tr', null, el('td', { class: 'num', text: String(i + 1) }),
        el('td', { class: 'small', text: item.id + (item.type === 'sym' ? ' (formula)' : '') }),
        el('td', null, rich(item.q)), el('td', item.type === 'mc' ? null : { class: 'mono' }, item.type === 'mc' ? rich(r[3] || '—') : (r[3] || '—')), el('td', null, keyNode(item)),
        el('td', null, chip(res[0], res[1]), r[4] && P.TAGS[r[4]] ? el('div', { style: 'margin-top:4px' }, chip('tag', P.TAGS[r[4]].name)) : null),
        el('td', { class: 'small num', text: r[2] + 's' }));
    });
    return el('div', { class: 'card' },
      el('p', { class: 'eyebrow', text: (d.date || '').replace('T', ' ').replace('Z', ' UTC') + ' · id ' + d.id }),
      el('h1', { text: d.name || '(no name)' }),
      el('p', { class: 'small', text: 'Time ' + clock(d.seconds || 0) + ' · ' + (d.log || []).length + ' questions · ' + (d.switches || 0) + ' window switches' }),
      el('div', { class: 'band' },
        el('span', { class: 'small', text: 'Overall level · average ' + (+d.avg).toFixed(2) + ' of 4' }),
        el('span', { class: 'name', text: sum.band.name }),
        el('span', { text: sum.band.say }), meter, meterLabels),
      el('h2', { text: 'What to work on' }),
      el('ul', { class: 'findings' }, findings(sum).map(function (f) { return el('li', null, el('b', { text: f.head }), f.text); })),
      el('h2', { text: 'Topics' }),
      el('p', { class: 'small', text: LEGEND }),
      el('div', { class: 'tablewrap' }, el('table', null,
        el('tr', null, ['#', 'Topic', 'Result', 'What to do', 'Levels'].map(function (h) { return el('th', { text: h }); })), rows)),
      el('h2', { text: 'Answers' }),
      el('div', { class: 'tablewrap' }, el('table', null,
        el('tr', null, ['#', 'Item', 'Question', 'Typed', 'Correct', 'Result', 'Time'].map(function (h) { return el('th', { text: h }); })), logRows)));
  }

  if (location.hash === '#report') { showViewer(); } else { showStart(); }
  window.addEventListener('hashchange', function () { if (location.hash === '#report' && !examActive) { showViewer(); } });
})();
</script>
</body>
